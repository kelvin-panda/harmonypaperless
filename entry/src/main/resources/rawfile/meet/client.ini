[selfinfo]
netcardport=
netcardip=
selfid=0
listport=0
softver=19
hardver=1
udppcap=1
#流采集传输方式  1使用tcp   0默认关闭
streamprotol=1
opustoaac=0
eventname=WClient
#可以指定一个设备ID，0表示使用以前默认的分配方式，0xffffffff表示使用随机ID
packetcachems=0
assignid=
#网络调试
tickdebug=0
#编解码调试
capturedebug=0
volumn0=100
volumn1=100
volumn2=100
volumn3=100
volumn4=100
volumn5=100
volumn6=100
volumn7=100
volumn8=100
volumn9=100
volumn10=100
volumn11=100

[debug]
enablemutiloper=1
enablenewfacepost=1


#是启用议题版本3模块 0表示关闭 1表示开启 默认不启用
agendav3=1
camaracap=0


enabledebug=0


#是否启用视频上传识别超高清转码 0关闭 1开启 默认0
mediatranscode=1

#是否开启调试窗口 0关闭 1开启 默认0
console=0
#是否开启显卡硬编码 0关闭 1开启 默认0
hwencode=0
#是否强制指定使用硬编码,当hwencode=1有效 0关闭 1开启 默认0
forcehwencode=0
#是否开启显卡硬解码 0关闭 1开启 默认0
hwdecode=0
#是否开启音频频谱图显示 0关闭 1开启 默认0
spectrum=1

#设备屏幕采集的间隔 eg:100.200毫秒内采集一帧
mincap=20
maxcap=120

#是否是较差的网络 1差 0良好
dirtynet=0

#设置流编码模式0高质量 1中等 2低带宽 默认0
encmode=1
#设置视频流stream(index)旋转参数 0不旋转 1左右对换 2上下对换 3上下左右对换 默认0
stream2=0
stream3=0

#设置视频流stream(index)width|height最大宽高 宽高同时设置才会生效
stream2width=1920
stream2height=1080
stream3width=1280
stream3height=720

#是否启动桌面采集声卡回放 0关闭 1开启 启用将扬声器输出捕获并附加到2号视频通道 当videoaudio=1启用时 注:优先使用输入音频附加
shareaudio=0
#将音频附加到视频通道中 0表示关闭 1表示开启
videoaudio=0
#video0指第一路视频通道  =0表示将第1个音频输入设备附加到第一路视频通道
video0=0
#video1指第一路视频通道  =1表示将第2个音频输入设备附加到第二路视频通道
video1=0

#是否开启分辨率修正 0关闭 1开启 默认0
fixresolution=0


#音频编码的码率 audiorate_(编码id)=
audiorate_11=64000
#禁用组播
disablemulticast=0

#由原来的设备启动强制发送请求改为检测有设备上线自动广播状态，减少区域服务器的转发 注需要所有终端都同时设置
autodos=0



#启用合并通知 单位毫秒 取值范围 1,4999
notifyms=300


#sm4 cbc加密优先级最大 加密效果较ecb强 开启后可以加密文档和网络传输 0关闭 1开启 默认0
sm4cbcencrypt=
#sm4 ecb加密优先级小于cbc速度快 开启后可以加密文档和网络传输  0关闭 1开启 默认0
sm4ecbencrypt=
#自有算法加密优先级最小速度最快 开启后可以加密文档和网络传输  0关闭 1开启 默认0
protolencrypt=


[Buffer Dir]
configdir=/data/storage/el2/base/haps/entry/files/meet/cache/
mediadir=/data/storage/el2/base/haps/entry/files/meet/media/
mediadirsize=5200

[areaaddr]
area0ip=10.248.6.138
area0port=2160


[Audio]
#注意，此处的声卡配置要与声卡初始化中的参数匹配，否则会不成功

#每个资源占用多少个输出通道
outchannelperres=1
#每个流占用多少个输入通道
inchannelperres=1

#输出资源的起始通道，dev为哪个设备，chn为通道
outres0dev=1
outres0chn=1
outres1dev=1
outres1chn=2

#输入流起始通道，dev为哪个设备，chn为通道
inres0dev=1
inres0chn=1
#inres1dev=1
#inres1chn=2

inres1dev=2
inres1chn=1

[JDSDebug]
# ip地址
ip=10.248.6.13
# 密钥
secret=222222222
#单位编码
szdw=9999999999


[loghttp]
#日志收集模块 1=启用 0=禁用 默认禁用
enable=0
port=19784
token=CHANGE-ME-TO-A-LONG-RANDOM-STRING
bind=0.0.0.0
; allow=192.168.1.0/24
max_conns=4
max_text_mb=32

; local integration test
#任务模块 1=启用 0=禁用 默认禁用
task_enable=1
task_password=123456
task_step_ms=1000
task_keep_days=7



